aid: getboxy
name: Boxy (ex-Storelift)
description: 'Boxy, operated by the French company SAS Storelift (founded 2018 in Ivry-sur-Seine by David
  Gabai and Tom Hayat), built unstaffed 24/7 convenience stores inside 15-20 square metre shipping containers,
  using computer vision, weight-sensing shelves and an on-site compute node so a shopper could unlock the
  door with a QR code from the Boxy mobile app, take products off the shelf and walk out to be invoiced
  automatically. The company raised roughly 5M EUR in 2020 and a 25M EUR Series A in February 2022 led
  by Serena with CapHorn and LocalGlobe, targeting 1,000 stores. It shut its entire store estate by the
  end of April 2024, and SAS Storelift entered liquidation judiciaire on 6 November 2024 after sauvegarde
  and redressement procedures earlier that year; the store containers were auctioned in early 2025. The
  getboxy.co domain is now parked and returns HTTP 410 Gone on every path, and no developer program, API
  documentation or machine-readable contract was ever published. This profile records that absence.'
